<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F Distribution Explorer</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../lib/chart.min.js"></script>
  <script src="../lib/jstat.min.js"></script>
</head>
<body class="applet">
<nav aria-label="Applet navigation"><a class="back-link" href="../index.html">← All applets</a></nav>

<details class="info">
  <summary>What does this show?</summary>
  <p>This applet visualizes the F distribution. Observe how the curve changes as you adjust the numerator and denominator degrees of freedom.</p>
</details>

<h1 class="page-title">F Distribution Explorer</h1>

<div class="slider-container">
  <label for="df1-slider">Degrees of Freedom 1 (df1): <span id="df1-value">1</span></label>
  <input type="range" id="df1-slider" min="1" max="100" step="1" value="1">
  <label for="df2-slider">Degrees of Freedom 2 (df2): <span id="df2-value">1</span></label>
  <input type="range" id="df2-slider" min="1" max="100" step="1" value="1">
</div>
<div class="critical-value-container">
  <p>Critical F-value for α=0.05: <span id="critical-value">N/A</span></p>
</div>

<p><label><input type="checkbox" id="log-axis"> Use logarithmic F axis</label></p>
<p id="plot-note" class="notice"></p>
<div class="chart-container">
  <div class="plot-frame"><canvas id="distributionChart"></canvas></div>
</div>

<script src="../javascript/statistics.js"></script>
<script src="../javascript/common.js"></script>
<script src="../javascript/f-distribution-explorer.js"></script>
</body>
</html>
