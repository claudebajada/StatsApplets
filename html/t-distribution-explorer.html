<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t Distribution Explorer</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../lib/chart.min.js"></script>
  <script src="../lib/jstat.min.js"></script>
</head>
<body class="applet">
<nav aria-label="Applet navigation"><a class="back-link" href="../index.html">← All applets</a></nav>

<details class="info">
  <summary>What does this show?</summary>
  <p>This applet plots the t distribution against the standard normal. Increase the degrees of freedom to watch the t curve approach normal.</p>
</details>

<h1 class="page-title">t Distribution Explorer</h1>

<div class="slider-container">
  <label for="df-slider">Degrees of Freedom (df): <span id="df-value">1</span></label>
  <input type="range" id="df-slider" min="1" max="100" step="1" value="1">
</div>

<div class="chart-container">
  <div class="plot-frame"><canvas id="distributionChart"></canvas></div>
</div>

<script src="../javascript/statistics.js"></script>
<script src="../javascript/common.js"></script>
<script src="../javascript/t-distribution-explorer.js"></script>
</body>
</html>
