<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Fifteen interactive statistics explorers for students learning about data, probability and inference."
    />
    <title>StatsApplets · Statistics, made visible</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="landing">
    <a class="skip-link" href="#main">Skip to explorers</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="brand" href="index.html">Stats<span>Applets</span></a
      ><a href="#explorers">Browse explorers</a>
    </nav>
    <main id="main">
      <header class="hero">
        <div>
          <p class="eyebrow">Interactive statistics for students</p>
          <h1>Move a slider.<br />See the statistics.</h1>
          <p class="lede">
            Choose a topic, try an example and explore how changing the values
            changes the results.
          </p>
        </div>
      </header>
      <section id="explorers" aria-label="Find an explorer">
        <div class="catalogue-tools">
          <label for="search">Find a concept</label
          ><input
            id="search"
            type="search"
            placeholder="Try “power” or “correlation”"
          />
          <p id="catalogue-count" role="status"></p>
        </div>
        <div id="catalogue"></div>
      </section>
    </main>
    <footer>
      StatsApplets · Claude J. Bajada ·
      <a href="https://github.com/claudebajada/StatsApplets"
        >Source, methods & contribution guide</a
      >
    </footer>
    <script src="javascript/catalogue.js"></script>
    <script src="javascript/index.js"></script>
  </body>
</html>
